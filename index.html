
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAWATY | دعوتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--main:#a87968;--bg:#f8f4f0;--card:#fff;--text:#39302d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,sans-serif}
header{text-align:center;padding:22px;background:var(--card);border-bottom:1px solid #eee}
.logo{font-size:27px;font-weight:800;color:var(--main)}
header p{margin:3px;color:#888;font-size:13px}
.container{max-width:1000px;margin:25px auto;padding:12px}
.panel{background:var(--card);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 5px 25px #00000008}
h2{font-size:19px;margin-top:0}
label{display:block;font-weight:700;margin:13px 0 6px;font-size:14px}
input,select,textarea{width:100%;padding:12px;border:1px solid #e4ded9;border-radius:10px;font:inherit;background:white;color:#333}
textarea{min-height:80px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.themes,.colors,.buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
button{border:0;border-radius:11px;padding:12px 17px;font:inherit;font-weight:700;cursor:pointer}
.theme,.secondary{background:#f0e9e5;color:#594b45}
.theme.active{outline:2px solid var(--main)}
.primary{background:var(--main);color:white}
.color{width:34px;height:34px;padding:0;border-radius:50%}
.color.active{outline:2px solid #222;outline-offset:3px}
.note{font-size:12px;color:#888;line-height:1.8}
#photoPreview{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:10px;display:none}
.preview{background:var(--bg);padding:20px;border-radius:16px;display:flex;justify-content:center}
.invitation{position:relative;width:100%;max-width:520px;padding:28px 20px;text-align:center;border:1px solid #e9dfd8;border-radius:17px;background:var(--card);color:var(--text);overflow:hidden}
.invitation:before{content:"";position:absolute;inset:8px;border:1px solid var(--main);border-radius:12px;opacity:.4;pointer-events:none}
.invitation .small{color:var(--main)}
.invitation h1{font:700 36px Amiri,serif;color:var(--main);margin:10px}
.invitation h2{font:700 28px Amiri,serif;margin:10px}
.invitation p{line-height:2}
.invitation img{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin:10px 0}
.details{background:var(--bg);padding:13px;border-radius:12px;line-height:2;margin-top:15px}
.hidden{display:none!important}
footer{text-align:center;color:#999;padding:22px;font-size:12px}
.status{padding:12px;border-radius:10px;background:#f3eee9;margin-top:12px;font-size:13px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:15px}.preview{padding:8px}}
</style>
</head>
<body>

<header>
 <div class="logo">DAWATY | دعوتي</div>
 <p>اصنع دعوتك بأسلوب يليق بفرحتك</p>
</header>

<main class="container">

<section id="builder">
 <div class="panel">
  <h2>💍 إنشاء دعوة زفاف</h2>

  <div class="grid">
   <div><label>اسم العريس</label><input id="groom" placeholder="اسم العريس"></div>
   <div><label>اسم العروس</label><input id="bride" placeholder="اسم العروس"></div>
   <div><label>تاريخ الزفاف</label><input id="date" type="date"></div>
   <div><label>وقت الحفل</label><input id="time" type="time"></div>
  </div>

  <label>مكان الحفل</label>
  <input id="place" placeholder="اسم القاعة">

  <label>رابط موقع القاعة (اختياري)</label>
  <input id="map" placeholder="رابط Google Maps">

  <label>رسالة الدعوة</label>
  <textarea id="message">بكل الحب والفرح نتشرف بدعوتكم لمشاركتنا أجمل لحظات العمر، حضوركم يزيد فرحتنا.</textarea>

  <label>صورة الدعوة</label>
  <input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
  <img id="photoPreview" alt="معاينة الصورة">
  <p class="note">الصورة تُرفع إلى التخزين السحابي، ولا تُضاف إلى الرابط.</p>

  <label>الثيم</label>
  <div class="themes">
   <button class="theme active" data-theme="classic">كلاسيكي</button>
   <button class="theme" data-theme="modern">عصري</button>
   <button class="theme" data-theme="royal">ملكي</button>
   <button class="theme" data-theme="floral">ورود</button>
   <button class="theme" data-theme="minimal">بسيط</button>
   <button class="theme" data-theme="night">ليلي</button>
   <button class="theme" data-theme="romantic">رومانسي</button>
   <button class="theme" data-theme="arabesque">شرقي</button>
  </div>

  <label>لون الدعوة</label>
  <div class="colors">
   <button class="color active" style="background:#a87968" data-color="#a87968"></button>
   <button class="color" style="background:#b99b61" data-color="#b99b61"></button>
   <button class="color" style="background:#8c6a83" data-color="#8c6a83"></button>
   <button class="color" style="background:#687f72" data-color="#687f72"></button>
   <button class="color" style="background:#526d91" data-color="#526d91"></button>
   <button class="color" style="background:#8b393e" data-color="#8b393e"></button>
   <button class="color" style="background:#343434" data-color="#343434"></button>
   <input type="color" id="customColor" value="#a87968" style="width:42px;height:38px;padding:2px">
  </div>

  <div class="buttons">
   <button class="primary" id="createBtn">إنشاء رابط الدعوة</button>
   <button class="secondary" id="previewBtn">معاينة</button>
  </div>
  <div id="status" class="status hidden"></div>
 </div>

 <div class="panel">
  <h2>معاينة الدعوة</h2>
  <div class="preview" id="preview"></div>
 </div>

 <div class="panel hidden" id="result">
  <h2>🎉 دعوتك جاهزة</h2>
  <input id="generatedUrl" readonly>
  <div class="buttons">
   <button class="primary" id="copyBtn">نسخ الرابط</button>
   <button class="secondary" id="whatsappBtn">مشاركة واتساب</button>
  </div>
  <p class="note">جرّب الرابط قبل إرساله للمدعوين.</p>
 </div>
</section>

<section id="guest" class="hidden">
 <div class="panel">
  <div class="preview" id="guestPreview"></div>
  <div class="buttons" style="justify-content:center">
   <button class="primary hidden" id="mapBtn">📍 موقع القاعة</button>
  </div>
 </div>
</section>

</main>
<footer>DAWATY © 2026</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://liqcywqlcfnvqxdyvhlf.supabase.co";
const SUPABASE_KEY="sb_publishable__N5C9X6byMfIX10epfs30w_sgP9oehZ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const themes={
 classic:{bg:"#f8f4f0",card:"#fff",text:"#39302d"},
 modern:{bg:"#f1f3f5",card:"#fff",text:"#263238"},
 royal:{bg:"#f5f0df",card:"#fffdf4",text:"#51401f"},
 floral:{bg:"#f8edf1",card:"#fffafd",text:"#684653"},
 minimal:{bg:"#f7f7f7",card:"#fff",text:"#333"},
 night:{bg:"#171923",card:"#242735",text:"#f5f1e8"},
 romantic:{bg:"#faedf0",card:"#fff8f8",text:"#70434f"},
 arabesque:{bg:"#edf2e9",card:"#fff",text:"#354b3d"}
};

let selectedTheme="classic";
let selectedColor="#a87968";
let photoFile=null;

const $=id=>document.getElementById(id);

function safe(v){
 return String(v||"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function validMap(value){
 try{
  const u=new URL(value);
  return u.protocol==="https:" && (u.hostname==="maps.google.com" || u.hostname==="www.google.com" || u.hostname==="google.com" || u.hostname==="maps.app.goo.gl");
 }catch{return false}
}

function applyTheme(){
 const t=themes[selectedTheme];
 document.documentElement.style.setProperty("--bg",t.bg);
 document.documentElement.style.setProperty("--card",t.card);
 document.documentElement.style.setProperty("--text",t.text);
 document.documentElement.style.setProperty("--main",selectedColor);
}

document.querySelectorAll(".theme").forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll(".theme").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  selectedTheme=btn.dataset.theme;
  applyTheme();updatePreview();
 };
});

document.querySelectorAll(".color").forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll(".color").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  selectedColor=btn.dataset.color;
  applyTheme();updatePreview();
 };
});

$("customColor").oninput=e=>{
 selectedColor=e.target.value;
 document.querySelectorAll(".color").forEach(x=>x.classList.remove("active"));
 applyTheme();updatePreview();
};

$("photo").onchange=e=>{
 photoFile=e.target.files[0]||null;
 if(photoFile){
  if(!photoFile.type.startsWith("image/")){
   alert("اختار ملف صورة صحيح");
   photoFile=null;return;
  }
  if(photoFile.size>8*1024*1024){
   alert("حجم الصورة كبير. اختار صورة أقل من 8 ميغابايت.");
   photoFile=null;e.target.value="";return;
  }
  const reader=new FileReader();
  reader.onload=()=>{
   $("photoPreview").src=reader.result;
   $("photoPreview").style.display="block";
   updatePreview();
  };
  reader.readAsDataURL(photoFile);
 }else{
  $("photoPreview").style.display="none";
  updatePreview();
 }
};

function getData(){
 return {
  groom:$("groom").value.trim(),
  bride:$("bride").value.trim(),
  date:$("date").value,
  time:$("time").value,
  place:$("place").value.trim(),
  map:$("map").value.trim(),
  message:$("message").value.trim(),
  theme:selectedTheme,
  color:selectedColor,
  photo_url:""
 };
}

function makeCard(d){
 const t=themes[d.theme]||themes.classic;
 const dateText=d.wedding_date||d.date
  ?new Date((d.wedding_date||d.date)+"T12:00:00").toLocaleDateString("ar-IQ",{year:"numeric",month:"long",day:"numeric"})
  :"سيتم تحديد الموعد";
 const timeText=d.wedding_time||d.time||"سيتم تحديد الوقت";
 const image=d.photo_url||"";
 return `
 <div class="invitation" style="background:${t.card};color:${t.text}">
  <div class="small">بسم الله الرحمن الرحيم</div>
  <h1>دعوة زفاف</h1>
  <p>بكل الحب والفرح نتشرف بدعوتكم لحضور حفل زفاف</p>
  ${image?`<img src="${safe(image)}" alt="صورة الدعوة">`:""}
  <h2>${safe(d.groom||"العريس")} & ${safe(d.bride||"العروس")}</h2>
  <p>${safe(d.message||"حضوركم يزيد فرحتنا")}</p>
  <div class="details">
   <div>📅 ${safe(dateText)}</div>
   <div>🕒 ${safe(timeText)}</div>
   <div>📍 ${safe(d.place||"سيتم تحديد المكان")}</div>
  </div>
  <p style="color:${safe(d.color||"#a87968")}">حضوركم يشرفنا ويكمل فرحتنا ♥</p>
 </div>`;
}

function updatePreview(){
 $("preview").innerHTML=makeCard(getData());
}

$("previewBtn").onclick=updatePreview;

function showStatus(message){
 $("status").textContent=message;
 $("status").classList.remove("hidden");
}

async function createInvitation(){
 const d=getData();
 if(!d.groom||!d.bride){
  alert("اكتب اسم العريس والعروس أولاً");
  return;
 }

 const btn=$("createBtn");
 btn.disabled=true;
 btn.textContent="جاري إنشاء الدعوة...";
 $("result").classList.add("hidden");

 try{
  let photoUrl=null;

  // رفع الصورة إلى Supabase Storage
  if(photoFile){
   showStatus("جاري رفع الصورة...");
   const imageBlob=await compressImage(photoFile);
   const path=crypto.randomUUID()+".jpg";

   const {error:uploadError}=await db.storage
    .from("invitation-photos")
    .upload(path,imageBlob,{
     contentType:"image/jpeg",
     cacheControl:"3600",
     upsert:false
    });

   if(uploadError)throw uploadError;

   const {data:urlData}=db.storage
    .from("invitation-photos")
    .getPublicUrl(path);

   photoUrl=urlData.publicUrl;
  }

  // حفظ بيانات الدعوة في قاعدة البيانات
  showStatus("جاري حفظ بيانات الدعوة...");
  const {data:id,error}=await db.rpc("create_invitation",{
   p_groom:d.groom,
   p_bride:d.bride,
   p_wedding_date:d.date||null,
   p_wedding_time:d.time||null,
   p_place:d.place||null,
   p_map_url:validMap(d.map)?d.map:null,
   p_message:d.message||null,
   p_photo_url:photoUrl,
   p_theme:d.theme,
   p_color:d.color
  });

  if(error)throw error;
  if(!id)throw new Error("لم يتم استلام رقم الدعوة");

  // رابط قصير يحمل رقم الدعوة فقط
  const link=location.origin+location.pathname+"?id="+encodeURIComponent(id);
  $("generatedUrl").value=link;
  $("result").classList.remove("hidden");
  $("status").classList.add("hidden");
  $("result").scrollIntoView({behavior:"smooth"});

 }catch(error){
  console.error(error);
  showStatus("ما اكتملت العملية: "+(error.message||"حدث خطأ. تأكد من إعدادات Supabase."));
  alert("تعذر إنشاء الدعوة. راجع رسالة الخطأ الظاهرة بالموقع.");
 }finally{
  btn.disabled=false;
  btn.textContent="إنشاء رابط الدعوة";
 }
}

function compressImage(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{
    let w=img.width,h=img.height,max=1200;
    if(w>h&&w>max){h=Math.round(h*max/w);w=max}
    else if(h>max){w=Math.round(w*max/h);h=max}
    const canvas=document.createElement("canvas");
    canvas.width=w;canvas.height=h;
    canvas.getContext("2d").drawImage(img,0,0,w,h);
    canvas.toBlob(blob=>{
     if(blob)resolve(blob);else reject(new Error("تعذر ضغط الصورة"));
    },"image/jpeg",0.78);
   };
   img.onerror=reject;
   img.src=reader.result;
  };
  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}

$("createBtn").onclick=createInvitation;

$("copyBtn").onclick=async()=>{
 try{
  await navigator.clipboard.writeText($("generatedUrl").value);
  alert("تم نسخ الرابط");
 }catch{
  $("generatedUrl").select();
  document.execCommand("copy");
  alert("تم نسخ الرابط");
 }
};

$("whatsappBtn").onclick=()=>{
 const url=$("generatedUrl").value;
 const msg="نتشرف بدعوتكم لمشاركتنا فرحتنا 💍\n"+url;
 window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
};

async function loadInvitation(){
 const id=new URLSearchParams(location.search).get("id");
 if(!id)return;

 $("builder").classList.add("hidden");
 $("guest").classList.remove("hidden");
 $("guestPreview").innerHTML="<p>جاري تحميل الدعوة...</p>";

 try{
  const {data,error}=await db.rpc("get_invitation",{p_id:id});
  if(error)throw error;
  if(!data){
   $("guestPreview").innerHTML="<p>عذراً، الدعوة غير موجودة.</p>";
   return;
  }

  $("guestPreview").innerHTML=makeCard(data);
  if(validMap(data.map_url||"")){
   $("mapBtn").classList.remove("hidden");
   $("mapBtn").onclick=()=>window.open(data.map_url,"_blank");
  }
  document.title="دعوة زفاف | DAWATY";

 }catch(error){
  console.error(error);
  $("guestPreview").innerHTML="<p>تعذر تحميل الدعوة. حاول مرة أخرى.</p>";
 }
}

applyTheme();
updatePreview();
loadInvitation();
</script>
</body>
</html>
